name: w-deploy

services:
  backend:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      WORKSPACE_PATH: /var/lib/paas/workspace
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/workspace:/var/lib/paas/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ proxy-net ]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-paas}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required — run: make setup}"
      POSTGRES_DB: ${DB_NAME:-paas_db}
    volumes:
      - paas-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ proxy-net ]

volumes:
  paas-pg-data:

networks:
  proxy-net:
    name: proxy-net
    driver: bridge
    attachable: true
