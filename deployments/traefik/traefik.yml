api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy-net
    watch: true

# Hanya dipakai jika TRAEFIK_TLS=true (tanpa Cloudflare Tunnel).
certificatesResolvers:
  cloudflare:
    acme:
      email: admin@domainanda.com
      storage: /acme/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"

log:
  level: INFO
