services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8000}:80"
    networks: [ proxy-net ]

  backend:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.paas-web.rule=Host(`${MAIN_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+\\.${MAIN_DOMAIN}$$`)"
      - "traefik.http.routers.paas-web.entrypoints=web"
      - "traefik.http.services.paas-web.loadbalancer.server.port=8080"
